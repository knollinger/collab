<div class="outer-cnr">

    <div class="patterns">

        <svg xmlns="http://www.w3.org/2000/svg"
             *ngFor="let pattern of patterns"
             [matTooltip]="getPatternName(pattern)"
             [attr.width]="getPatternWidth(pattern)"
             [attr.height]="getPatternHeight(pattern)"
             class="image"
             [class.mat-elevation-z4]="isSelected(pattern)"
             (click)="onClick(pattern)">
            <defs [innerHTML]="pattern.outerHTML | safe:'html'">
            </defs>
            <rect width="30"
                  height="30"
                  [attr.fill]="makeUrl(pattern)" />
        </svg>
        
    </div>

    <mat-form-field class="color-selector">
        <mat-label>Farbe</mat-label>
        <input matInput type="color">
    </mat-form-field>
</div>
