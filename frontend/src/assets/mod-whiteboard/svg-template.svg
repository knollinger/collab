<svg xmlns="http://www.w3.org/2000/svg" style="width: 0px; height: 0px;">

    <style > 
        .hidden { display: none; } 
        rect, polygone, ellipse, foreignObject { cursor: move; } 
        .decorator-frame { stroke: lightgray; stroke-width: 2; stroke-dasharray: 2 2; fill: transparent; } 
        .drag-ne { cursor: ne-resize; } 
        .drag-n { cursor: n-resize; } 
        .drag-nw { cursor: nw-resize; } 
        .drag-w { cursor: w-resize; } 
        .drag-e { cursor: e-resize; } 
        .drag-se { cursor: se-resize; } 
        .drag-s { cursor: s-resize; } 
        .drag-sw { cursor: sw-resize; } 
        .drag-start, .drag-end { cursor: move; } 
    </style>
    
    <!-- Vordefinierte FillPatterns -->
    <defs id="fillPatterns">

        <pattern id="pattern-gridLines" name="crosshair" patternUnits="userSpaceOnUse" width="31" height="31" class="fill-pattern" color="lightblue">
            <line x1="16" y1="0" x2="16" y2="31" fill="none" stroke="currentColor" stroke-width="1" stroke-dasharray="2 2" />
            <line x1="0"  y1="16" x2="31" y2="16" fill="none" stroke="currentColor" stroke-width="1" stroke-dasharray="2 2" />
        </pattern>

        <pattern id="pattern-vertical" name="vertical" patternUnits="userSpaceOnUse" width="32" height="32" class="fill-pattern" color="black">
            <line x1="0" y1="0" x2="0" y2="31" fill="none" stroke="currentColor" stroke-width="1" />
            <line x1="4" y1="0" x2="4" y2="31" fill="none" stroke="currentColor" stroke-width="1" />
            <line x1="8" y1="0" x2="8" y2="31" fill="none" stroke="currentColor" stroke-width="1" />
            <line x1="12" y1="0" x2="12" y2="31" fill="none" stroke="currentColor" stroke-width="1" />
            <line x1="16" y1="0" x2="16" y2="31" fill="none" stroke="currentColor" stroke-width="1" />
            <line x1="20" y1="0" x2="20" y2="31" fill="none" stroke="currentColor" stroke-width="1" />
            <line x1="24" y1="0" x2="24" y2="31" fill="none" stroke="currentColor" stroke-width="1" />
            <line x1="28" y1="0" x2="28" y2="31" fill="none" stroke="currentColor" stroke-width="1" />
        </pattern>

        <pattern id="pattern-horizontal" name="horizontal" patternUnits="userSpaceOnUse" width="32" height="32" class="fill-pattern" color="black">
            <line y1="0" x1="0" y2="0" x2="31" fill="none" stroke="currentColor" stroke-width="1" />
            <line y1="4" x1="0" y2="4" x2="31" fill="none" stroke="currentColor" stroke-width="1" />
            <line y1="8" x1="0" y2="8" x2="31" fill="none" stroke="currentColor" stroke-width="1" />
            <line y1="12" x1="0" y2="12" x2="31" fill="none" stroke="currentColor" stroke-width="1" />
            <line y1="16" x1="0" y2="16" x2="31" fill="none" stroke="currentColor" stroke-width="1" />
            <line y1="20" x1="0" y2="20" x2="31" fill="none" stroke="currentColor" stroke-width="1" />
            <line y1="24" x1="0" y2="24" x2="31" fill="none" stroke="currentColor" stroke-width="1" />
            <line y1="28" x1="0" y2="28" x2="31" fill="none" stroke="currentColor" stroke-width="1" />
        </pattern>

    </defs>
    
    <!-- Die GridLines  -->
    <rect id="gridLines" width="100%" height="100%" fill="url(#pattern-gridLines)" class="hidden" color="lightblue"/>
    
    <!-- Die Gruppe aller Shapes -->
    <g id="shapes-group" />
    
    <!-- die Gruppe aller Lines -->
    <g id="lines-group" />
</svg>
